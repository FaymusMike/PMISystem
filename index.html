<head>

  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --primary: #0d6efd;
      --primary-dark: #0a58ca;
      --secondary-bg: #f8f9fc;
      --accent: #22c55e;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #0ea5e9;
      --glass-bg: rgba(255,255,255,0.75);
      --glass-border: rgba(255,255,255,0.3);
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
      --radius: 1.25rem;
      --transition: 0.25s ease;
      --font: 'Poppins', sans-serif;
      --body-bg: #f2f6fc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --border-color: #e2e8f0;
      --table-stripe: #f8fafc;
    }
    [data-bs-theme="dark"] {
      --body-bg: #0f172a;
      --card-bg: #1e293b;
      --text-color: #e2e8f0;
      --border-color: #334155;
      --table-stripe: #2d3b52;
      --glass-bg: rgba(15,23,42,0.8);
      --secondary-bg: #1a2332;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font);
      background: var(--body-bg);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    /* ===== GLASS ===== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }
    .card {
      border: none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: var(--card-bg);
      color: var(--text-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
    .gradient-header { background: linear-gradient(135deg, #0d6efd, #0a58ca); color: white; }
    /* ===== UTILITIES ===== */
    .counter-value { font-weight: 700; font-size: 2rem; line-height: 1.2; }
    .avatar-sm { width: 38px; height: 38px; object-fit: cover; border-radius: 50%; }
    .avatar-md { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; }
    .avatar-lg { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
    .status-badge { font-size: 0.7rem; font-weight: 600; padding: 0.25rem 0.75rem; border-radius: 2rem; }
    .bg-soft-primary { background: #dbeafe; color: #1e40af; }
    .bg-soft-success { background: #d1fae5; color: #065f46; }
    .bg-soft-danger { background: #fecaca; color: #991b1b; }
    .bg-soft-warning { background: #fef3c7; color: #92400e; }
    .bg-soft-secondary { background: #e2e8f0; color: #334155; }
    .bg-soft-info { background: #dbeafe; color: #1e40af; }
    [data-bs-theme="dark"] .bg-soft-primary { background: #1e3a5f; color: #93c5fd; }
    [data-bs-theme="dark"] .bg-soft-success { background: #1e3a2f; color: #6ee7b7; }
    [data-bs-theme="dark"] .bg-soft-danger { background: #4c1d1d; color: #fca5a5; }
    [data-bs-theme="dark"] .bg-soft-warning { background: #4d3d0a; color: #fcd34d; }
    [data-bs-theme="dark"] .bg-soft-secondary { background: #334155; color: #cbd5e1; }
    [data-bs-theme="dark"] .bg-soft-info { background: #1e3a5f; color: #93c5fd; }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    /* ===== LOGIN ===== */
    .login-bg {
      background: linear-gradient(135deg, #0b1d31 0%, #1a3a5c 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
    }
    [data-bs-theme="dark"] .login-card { background: rgba(30,41,59,0.95); color: #e2e8f0; }
    .setup-card { max-width: 460px; }
    /* ===== SIDEBAR ===== */
    .sidebar-link {
      padding: 0.6rem 1rem;
      border-radius: 0.8rem;
      color: var(--text-color);
      transition: 0.2s;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: var(--primary);
      color: white;
    }
    [data-bs-theme="dark"] .sidebar-link:hover,
    [data-bs-theme="dark"] .sidebar-link.active { background: #1d4ed8; }
    /* ===== TABLES ===== */
    .table { color: var(--text-color); }
    .table-striped>tbody>tr:nth-of-type(odd) { background: var(--table-stripe); }
    .table th { font-weight: 600; border-color: var(--border-color); }
    .table td { border-color: var(--border-color); }
    [data-bs-theme="dark"] .table-striped>tbody>tr:nth-of-type(odd) { background: #2d3b52; }
    /* ===== FORMS ===== */
    .form-control, .form-select {
      background: var(--card-bg);
      color: var(--text-color);
      border-color: var(--border-color);
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(13,110,253,0.15);
    }
    /* ===== MISC ===== */
    .section-title { font-weight: 600; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--primary); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
    .empty-state i { font-size: 3rem; display: block; margin-bottom: 1rem; }
    .navbar { background: var(--card-bg) !important; border-bottom: 1px solid var(--border-color); }
    .offcanvas { background: var(--card-bg); color: var(--text-color); }
    .offcanvas .btn-close { filter: var(--bs-btn-close-filter, none); }
    .toast-container { z-index: 9999; }
    .skeleton { background: #e2e8f0; border-radius: 0.5rem; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    .sidebar { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      .counter-value { font-size: 1.4rem; }
      .login-card { padding: 1.5rem; }
      .sidebar { position: static; height: auto; }
    }
    @media (max-width: 576px) {
      .login-card { padding: 1rem; }
      .card-body { padding: 1rem; }
    }
  </style>

<script>
// ================================================================
//  ABU LIBRARY PMIS — Full Application
//  MSc Computer Science Project Prototype
//  Case Study: Kashim Ibrahim Library, ABU, Zaria
// ================================================================

(function() {
  "use strict";

  // =================================================================
  //  1. STORAGE HELPERS
  // =================================================================
  const LS = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { localStorage.setItem(k, JSON.stringify(v)); },
    remove(k) { localStorage.removeItem(k); },
    has(k) { return localStorage.getItem(k) !== null; }
  };

  // =================================================================
  //  2. DATA INITIALIZATION & SAFE MIGRATION
  // =================================================================
  function initData() {
    // --- Backup legacy data ---
    if (LS.has('employees')) {
      LS.set('_legacy_employees_backup', LS.get('employees'));
    }
    if (LS.has('departments')) {
      LS.set('_legacy_departments_backup', LS.get('departments'));
    }

    // --- Initialize new collections if they don't exist ---
    if (!LS.has('staff')) {
      // Users
      if (!LS.has('users')) {
        LS.set('users', []);
      }

      // Staff Categories
      if (!LS.has('staffCategories')) {
        LS.set('staffCategories', [
          { id: 'cat_1', name: 'Academic Librarian' },
          { id: 'cat_2', name: 'Senior Technical Staff' },
          { id: 'cat_3', name: 'Junior Technical Staff' },
          { id: 'cat_4', name: 'Administrative Staff' },
          { id: 'cat_5', name: 'Other' }
        ]);
      }

      // Ranks
      if (!LS.has('ranks')) {
        LS.set('ranks', [
          { id: 'rank_1', name: 'University Librarian' },
          { id: 'rank_2', name: 'Deputy University Librarian' },
          { id: 'rank_3', name: 'Senior Librarian' },
          { id: 'rank_4', name: 'Librarian I' },
          { id: 'rank_5', name: 'Librarian II' },
          { id: 'rank_6', name: 'Chief Library Officer' },
          { id: 'rank_7', name: 'Principal Library Officer' },
          { id: 'rank_8', name: 'Senior Library Officer' },
          { id: 'rank_9', name: 'Library Officer' },
          { id: 'rank_10', name: 'Library Attendant' },
          { id: 'rank_11', name: 'Other' }
        ]);
      }

      // Libraries
      if (!LS.has('libraries')) {
        LS.set('libraries', [
          { id: 'lib_1', name: 'Kashim Ibrahim Library', description: 'Main University Library', createdAt: new Date().toISOString() }
        ]);
      }

      // Divisions
      if (!LS.has('divisions')) {
        LS.set('divisions', [
          { id: 'div_1', name: 'Resource Development', libraryId: 'lib_1', description: 'Collection development and acquisitions', createdAt: new Date().toISOString() },
          { id: 'div_2', name: 'Customer Services', libraryId: 'lib_1', description: 'Circulation and user services', createdAt: new Date().toISOString() },
          { id: 'div_3', name: 'Resource Processing', libraryId: 'lib_1', description: 'Cataloguing and classification', createdAt: new Date().toISOString() },
          { id: 'div_4', name: 'Reference and Information Services', libraryId: 'lib_1', description: 'Reference and information literacy', createdAt: new Date().toISOString() },
          { id: 'div_5', name: 'Serials Management', libraryId: 'lib_1', description: 'Journal and serials management', createdAt: new Date().toISOString() },
          { id: 'div_6', name: 'Research and Bibliographic Services', libraryId: 'lib_1', description: 'Research support and bibliographic services', createdAt: new Date().toISOString() },
          { id: 'div_7', name: 'Human Resources', libraryId: 'lib_1', description: 'Staff administration and development', createdAt: new Date().toISOString() },
          { id: 'div_8', name: 'ICT', libraryId: 'lib_1', description: 'Information and Communication Technology', createdAt: new Date().toISOString() }
        ]);
      }

      // Units
      if (!LS.has('units')) {
        LS.set('units', [
          { id: 'unit_1', name: 'Digitization', divisionId: 'div_8', description: 'Digitization of library materials', createdAt: new Date().toISOString() },
          { id: 'unit_2', name: 'Technical Services', divisionId: 'div_8', description: 'IT technical support', createdAt: new Date().toISOString() },
          { id: 'unit_3', name: 'Information Commons', divisionId: 'div_8', description: 'Information commons management', createdAt: new Date().toISOString() },
          { id: 'unit_4', name: 'Postgraduate Electronic Library', divisionId: 'div_8', description: 'Postgraduate e-library services', createdAt: new Date().toISOString() },
          { id: 'unit_5', name: 'Internet Training / Electronic Classroom', divisionId: 'div_8', description: 'Internet training and electronic classroom', createdAt: new Date().toISOString() },
          { id: 'unit_6', name: 'Acquisitions', divisionId: 'div_1', description: 'Acquisitions and ordering', createdAt: new Date().toISOString() },
          { id: 'unit_7', name: 'Cataloguing', divisionId: 'div_3', description: 'Cataloguing and classification', createdAt: new Date().toISOString() },
          { id: 'unit_8', name: 'Circulation', divisionId: 'div_2', description: 'Circulation and lending', createdAt: new Date().toISOString() }
        ]);
      }

      // Leave Types (configurable)
      if (!LS.has('leaveTypes')) {
        LS.set('leaveTypes', ['Annual Leave', 'Study Leave', 'Sick Leave', 'Maternity Leave', 'Paternity Leave', 'Other']);
      }

      // Staff (empty initially, will seed demo data)
      if (!LS.has('staff')) {
        LS.set('staff', []);
        LS.set('_staffCounter', 0);
      }

      // Employment History
      if (!LS.has('employmentHistory')) {
        LS.set('employmentHistory', []);
      }

      // Leave Records
      if (!LS.has('leaveRecords')) {
        LS.set('leaveRecords', []);
      }

      // Training Records
      if (!LS.has('trainingRecords')) {
        LS.set('trainingRecords', []);
      }

      // Settings
      if (!LS.has('settings')) {
        LS.set('settings', {
          theme: 'light',
          systemName: 'ABU Library PMIS',
          institution: 'Ahmadu Bello University',
          libraryName: 'Kashim Ibrahim Library'
        });
      }

      // --- Seed Demo Staff ---
      seedDemoStaff();
    }

    // Apply theme
    const settings = LS.get('settings');
    if (settings && settings.theme) {
      applyTheme(settings.theme);
    }
  }

  // =================================================================
  //  3. DEMO DATA SEEDING
  // =================================================================
  function seedDemoStaff() {
    const staff = LS.get('staff') || [];
    if (staff.length > 0) return; // Only seed if empty

    const categories = LS.get('staffCategories') || [];
    const ranks = LS.get('ranks') || [];
    const divisions = LS.get('divisions') || [];
    const units = LS.get('units') || [];

    const getCat = (name) => categories.find(c => c.name === name)?.id || categories[0]?.id;
    const getRank = (name) => ranks.find(r => r.name === name)?.id || ranks[0]?.id;
    const getDiv = (name) => divisions.find(d => d.name === name)?.id || divisions[0]?.id;
    const getUnit = (name) => units.find(u => u.name === name)?.id || units[0]?.id;

    const demoStaff = [
      { firstName: 'Aisha', surname: 'Ibrahim', gender: 'Female', staffCategory: 'Academic Librarian', rank: 'Senior Librarian', division: 'ICT', unit: 'Digitization', status: 'Active', email: 'aisha.ibrahim@abu.edu.ng' },
      { firstName: 'Musa', surname: 'Abdullahi', gender: 'Male', staffCategory: 'Senior Technical Staff', rank: 'Chief Library Officer', division: 'ICT', unit: 'Technical Services', status: 'Active', email: 'musa.abdullahi@abu.edu.ng' },
      { firstName: 'Fatima', surname: 'Bello', gender: 'Female', staffCategory: 'Academic Librarian', rank: 'Librarian I', division: 'Resource Processing', unit: 'Cataloguing', status: 'Active', email: 'fatima.bello@abu.edu.ng' },
      { firstName: 'Daniel', surname: 'Yusuf', gender: 'Male', staffCategory: 'Junior Technical Staff', rank: 'Library Officer', division: 'Customer Services', unit: 'Circulation', status: 'Active', email: 'daniel.yusuf@abu.edu.ng' },
      { firstName: 'Grace', surname: 'Emmanuel', gender: 'Female', staffCategory: 'Administrative Staff', rank: 'Senior Library Officer', division: 'Human Resources', unit: null, status: 'Active', email: 'grace.emmanuel@abu.edu.ng' },
      { firstName: 'Samuel', surname: 'Okafor', gender: 'Male', staffCategory: 'Academic Librarian', rank: 'Librarian II', division: 'Reference and Information Services', unit: null, status: 'Active', email: 'samuel.okafor@abu.edu.ng' },
      { firstName: 'Zainab', surname: 'Mohammed', gender: 'Female', staffCategory: 'Senior Technical Staff', rank: 'Principal Library Officer', division: 'ICT', unit: 'Postgraduate Electronic Library', status: 'Active', email: 'zainab.mohammed@abu.edu.ng' },
      { firstName: 'Peter', surname: 'Okonkwo', gender: 'Male', staffCategory: 'Junior Technical Staff', rank: 'Library Attendant', division: 'Customer Services', unit: 'Circulation', status: 'Active', email: 'peter.okonkwo@abu.edu.ng' },
      { firstName: 'Ngozi', surname: 'Eze', gender: 'Female', staffCategory: 'Academic Librarian', rank: 'Senior Librarian', division: 'Serials Management', unit: null, status: 'On Leave', email: 'ngozi.eze@abu.edu.ng' },
      { firstName: 'Ahmed', surname: 'Bello', gender: 'Male', staffCategory: 'Senior Technical Staff', rank: 'Chief Library Officer', division: 'Resource Development', unit: 'Acquisitions', status: 'Active', email: 'ahmed.bello@abu.edu.ng' },
      { firstName: 'Mary', surname: 'John', gender: 'Female', staffCategory: 'Administrative Staff', rank: 'Library Officer', division: 'Human Resources', unit: null, status: 'Active', email: 'mary.john@abu.edu.ng' },
      { firstName: 'Joseph', surname: 'Ali', gender: 'Male', staffCategory: 'Academic Librarian', rank: 'Librarian I', division: 'ICT', unit: 'Information Commons', status: 'Active', email: 'joseph.ali@abu.edu.ng' },
      { firstName: 'Rebecca', surname: 'Chukwu', gender: 'Female', staffCategory: 'Junior Technical Staff', rank: 'Senior Library Officer', division: 'ICT', unit: 'Internet Training / Electronic Classroom', status: 'Active', email: 'rebecca.chukwu@abu.edu.ng' },
      { firstName: 'Ibrahim', surname: 'Usman', gender: 'Male', staffCategory: 'Academic Librarian', rank: 'Librarian II', division: 'Research and Bibliographic Services', unit: null, status: 'Retired', email: 'ibrahim.usman@abu.edu.ng' },
      { firstName: 'Catherine', surname: 'Obi', gender: 'Female', staffCategory: 'Other', rank: 'Other', division: 'ICT', unit: 'Technical Services', status: 'Active', email: 'catherine.obi@abu.edu.ng' }
    ];

    let counter = 0;
    const newStaff = demoStaff.map((s, idx) => {
      counter++;
      const staffId = 'KIL-STAFF-' + String(counter).padStart(4, '0');
      const now = new Date();
      const appointmentDate = new Date(now.getFullYear() - 5 - Math.floor(Math.random() * 10), Math.floor(Math.random() * 12), 1 + Math.floor(Math.random() * 28));
      return {
        id: 's_' + Date.now() + '_' + idx,
        staffId: staffId,
        title: ['Mr', 'Mrs', 'Ms', 'Dr', 'Prof'][Math.floor(Math.random() * 5)],
        firstName: s.firstName,
        middleName: '',
        surname: s.surname,
        gender: s.gender,
        dateOfBirth: new Date(now.getFullYear() - 30 - Math.floor(Math.random() * 20), Math.floor(Math.random() * 12), 1 + Math.floor(Math.random() * 28)).toISOString().split('T')[0],

        email: s.email,

        createdAt: new Date().toISOString()
      };
    });

    LS.set('staff', newStaff);
    LS.set('_staffCounter', counter);

    // Seed some leave records
    const leaveRecords = [];
    const leaveTypes = LS.get('leaveTypes') || ['Annual Leave', 'Study Leave', 'Sick Leave'];
    newStaff.slice(0, 5).forEach((s, idx) => {
      const start = new Date();
      start.setDate(start.getDate() + 5 + idx * 10);
      const end = new Date(start);
      end.setDate(end.getDate() + 3 + idx);
      leaveRecords.push({
        id: 'leave_' + Date.now() + '_' + idx,
        staffId: s.staffId,
        staffName: s.firstName + ' ' + s.surname,
        leaveType: leaveTypes[idx % leaveTypes.length],
        startDate: start.toISOString().split('T')[0],
        endDate: end.toISOString().split('T')[0],
        numberOfDays: 3 + idx,

        remarks: 'Approved by supervisor',
        createdAt: new Date().toISOString()
      });

    // Seed some training records
    const trainingRecords = [];
    const trainings = ['Digital Libraries Workshop', 'Leadership in Libraries', 'ICT for Librarians', 'Research Data Management', 'Cataloguing and Classification'];
    newStaff.slice(0, 6).forEach((s, idx) => {
      const start = new Date();
      start.setFullYear(start.getFullYear() - 1 - Math.floor(idx / 2));
      start.setMonth(idx % 12);
      start.setDate(1 + idx % 28);
      const end = new Date(start);
      end.setDate(end.getDate() + 2 + idx % 3);
      trainingRecords.push({
        id: 'train_' + Date.now() + '_' + idx,
        staffId: s.staffId,
        staffName: s.firstName + ' ' + s.surname,
        programmeName: trainings[idx % trainings.length],
        organizer: 'NLA',
        location: 'Abuja',
        startDate: start.toISOString().split('T')[0],
        endDate: end.toISOString().split('T')[0],
        duration: 2 + idx % 3,
        status: ['Completed', 'Ongoing', 'Upcoming'][idx % 3],
        certificate: ['Yes', 'No', 'Pending'][idx % 3],
        remarks: 'Gained valuable skills',
        createdAt: new Date().toISOString()
      });
    });
    LS.set('trainingRecords', trainingRecords);

    // Seed some employment history
    const history = [];
    newStaff.slice(0, 8).forEach((s, idx) => {
      const date1 = new Date(s.dateFirstAppointment);
      date1.setFullYear(date1.getFullYear() + 2 + idx % 3);
      const date2 = new Date(date1);
      date2.setFullYear(date2.getFullYear() + 3 + idx % 2);
      history.push({
        id: 'hist_' + Date.now() + '_' + idx + '_1',
        staffId: s.staffId,
        staffName: s.firstName + ' ' + s.surname,
        eventDate: date1.toISOString().split('T')[0],
        eventType: 'Promotion',
        previousValue: s.rankId,
        newValue: s.rankId,
        remarks: 'Promoted to ' + (LS.get('ranks') || [])[idx % 3]?.name || 'Senior Position',
        createdAt: new Date().toISOString()
      });
      history.push({
        id: 'hist_' + Date.now() + '_' + idx + '_2',
        staffId: s.staffId,
        staffName: s.firstName + ' ' + s.surname,
        eventDate: date2.toISOString().split('T')[0],
        eventType: 'Transfer',
        previousValue: s.divisionId,
        newValue: s.divisionId,
        remarks: 'Transferred to ' + (LS.get('divisions') || [])[idx % 5]?.name || 'New Division',
        createdAt: new Date().toISOString()
      });
    });
    LS.set('employmentHistory', history);
  }

  // =================================================================
  //  4. THEME
  // =================================================================
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-bs-theme', theme);
    const btn = document.getElementById('themeToggle');
    if (btn) {
      btn.innerHTML = theme === 'dark' ? '<i class="bi bi-sun"></i>' : '<i class="bi bi-moon"></i>';
    }
    const settings = LS.get('settings') || {};
    settings.theme = theme;
    LS.set('settings', settings);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
    const next = current === 'light' ? 'dark' : 'light';
    applyTheme(next);
  }

  // =================================================================
  //  5. AUTHENTICATION
  // =================================================================
  function checkAuth() {
    const user = LS.get('currentUser');
    if (user) {
      document.getElementById('authPage').style.display = 'none';
      document.getElementById('appContainer').style.display = 'block';
      return true;
    }
    // Check if any user exists
    const users = LS.get('users') || [];
    if (users.length === 0) {
      showSetupScreen();
    } else {
      showLoginScreen();
    }
    document.getElementById('authPage').style.display = 'flex';
    document.getElementById('appContainer').style.display = 'none';
    return false;
  }

  function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const users = LS.get('users') || [];
    const found = users.find(u => u.username === username && u.password === password);
    if (found) {
      LS.set('currentUser', { id: found.id, username: found.username });
      document.getElementById('loginError').classList.add('d-none');
      checkAuth();
      renderPage(currentPage);
      showToast('Welcome back, ' + username, 'success');
    } else {
      document.getElementById('loginError').classList.remove('d-none');
    }
  }

  function handleSetup(e) {
    e.preventDefault();
    const username = document.getElementById('setupUsername').value.trim();
    const password = document.getElementById('setupPassword').value.trim();
    if (!username || !password || username.length < 3 || password.length < 4) {
      document.getElementById('setupError').classList.remove('d-none');
      document.getElementById('setupError').textContent = 'Username (min 3) and password (min 4) required.';
      return;
    }
    const users = LS.get('users') || [];
    if (users.find(u => u.username === username)) {
      document.getElementById('setupError').classList.remove('d-none');
      document.getElementById('setupError').textContent = 'Username already exists.';
      return;
    }
    users.push({ id: 'u_' + Date.now(), username: username, password: password });
    LS.set('users', users);
    LS.set('currentUser', { id: users[users.length - 1].id, username: username });
    showToast('Account created successfully!', 'success');
    checkAuth();
    renderPage('dashboard');
  }

  function logout() {
    LS.remove('currentUser');
    checkAuth();
    showToast('Logged out', 'info');
  }

  // =================================================================
  //  6. TOAST NOTIFICATIONS
  // =================================================================
  function showToast(msg, type = 'success') {
    const container = document.getElementById('toastContainer');
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-bg-${type} border-0 fade-in`;
    toast.role = 'alert';
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    container.appendChild(toast);
    const bsToast = new bootstrap.Toast(toast, { autohide: true, delay: 3500 });
    bsToast.show();
    toast.addEventListener('hidden.bs.toast', () => toast.remove());
  }

  // =================================================================
  //  7. HTML ESCAPING (Security)
  // =================================================================
  function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // =================================================================
  //  8. APPLICATION STATE & NAVIGATION
  // =================================================================
  let currentPage = 'dashboard';
  let chartInstances = {};

  function navigateTo(page) {
    currentPage = page;
    // Update sidebar active state
    document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
    document.querySelectorAll(`.sidebar-link[data-page="${page}"]`).forEach(el => el.classList.add('active'));
    // Close mobile offcanvas
    const canvas = bootstrap.Offcanvas.getInstance(document.getElementById('sidebarCanvas'));
    if (canvas) canvas.hide();
    renderPage(page);
  }

  // Sidebar click handler
  document.addEventListener('click', function(e) {
    const link = e.target.closest('.sidebar-link');
    if (link && link.dataset.page) {
      e.preventDefault();
      navigateTo(link.dataset.page);
    }
  });

  // =================================================================
  //  9. RENDER ENGINE
  // =================================================================
  function renderPage(page) {
    const content = document.getElementById('pageContent');
    switch(page) {
      case 'dashboard': renderDashboard(content); break;
      case 'staff-records': renderStaffRecords(content); break;
      case 'library-structure': renderLibraryStructure(content); break;
      case 'leave-management': renderLeaveManagement(content); break;
      case 'training-management': renderTrainingManagement(content); break;
      case 'reports': renderReports(content); break;
      case 'settings': renderSettings(content); break;
      default: content.innerHTML = '<h4>Page not found</h4>';
    }
  }

  function drawDivChart(staff) {
    const divisions = LS.get('divisions') || [];
    const labels = divisions.map(d => d.name);
    const data = labels.map(l => staff.filter(s => {
      const div = divisions.find(d => d.id === s.divisionId);
      return div && div.name === l;

    const ctx = document.getElementById('dashDivChart')?.getContext('2d');

    if (chartInstances.dashDiv) chartInstances.dashDiv.destroy();
    chartInstances.dashDiv = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: labels.length ? labels : ['No Data'], datasets: [{ data: labels.length ? data : [1], backgroundColor: ['#0d6efd','#22c55e','#f59e0b','#ef4444','#0ea5e9','#8b5cf6','#ec4899','#14b8a6'] }] },

    });
  }

    const categories = LS.get('staffCategories') || [];

      const cat = categories.find(c => c.id === s.staffCategoryId);

                           s.employmentStatus === 'Retired' ? 'danger' :
                           s.employmentStatus === 'Suspended' ? 'warning' : 'secondary';
        return `<tr>
          <td><span class="fw-semibold small">${escapeHtml(s.staffId)}</span></td>
          <td>${escapeHtml(s.firstName)} ${escapeHtml(s.surname)}</td>
          <td>${escapeHtml(cat?.name || '-')}</td>
          <td>${escapeHtml(rank?.name || '-')}</td>
          <td>${escapeHtml(div?.name || '-')}</td>
          <td>${escapeHtml(unit?.name || '-')}</td>
          <td><span class="badge bg-soft-${statusColor}">${escapeHtml(s.employmentStatus || 'Active')}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-primary viewStaff" data-id="${s.id}"><i class="bi bi-eye"></i></button>
            <button class="btn btn-sm btn-outline-warning editStaff" data-id="${s.id}"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-sm btn-outline-danger deleteStaff" data-id="${s.id}"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('.viewStaff').forEach(b => b.addEventListener('click', () => viewStaff(b.dataset.id)));
      tbody.querySelectorAll('.editStaff').forEach(b => b.addEventListener('click', () => openStaffForm(b.dataset.id)));
      tbody.querySelectorAll('.deleteStaff').forEach(b => b.addEventListener('click', () => deleteStaff(b.dataset.id)));
    }

    function filterStaff() {
      const search = (document.getElementById('searchStaff')?.value || '').toLowerCase();
      const catFilter = document.getElementById('filterCategory')?.value || '';
      const divFilter = document.getElementById('filterDivision')?.value || '';
      const statusFilter = document.getElementById('filterStatus')?.value || '';
      filteredStaff = staff.filter(s => {
        const matchSearch = (s.staffId || '').toLowerCase().includes(search) ||
                           (s.firstName || '').toLowerCase().includes(search) ||
                           (s.surname || '').toLowerCase().includes(search) ||
                           (LS.get('divisions')?.find(d => d.id === s.divisionId)?.name || '').toLowerCase().includes(search);
        const matchCat = !catFilter || s.staffCategoryId === catFilter;
        const matchDiv = !divFilter || s.divisionId === divFilter;
        const matchStatus = !statusFilter || s.employmentStatus === statusFilter;
        return matchSearch && matchCat && matchDiv && matchStatus;
      });
      currentPageNum = 1;
      updatePagination();
    }

    function updatePagination() {
      const totalPages = Math.ceil(filteredStaff.length / pageSize) || 1;
      if (currentPageNum > totalPages) currentPageNum = totalPages;
      const start = (currentPageNum - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filteredStaff.slice(start, end);
      renderStaffTable(pageData);

      const pagination = document.getElementById('staffPagination');
      if (filteredStaff.length <= pageSize) {
        pagination.innerHTML = `<span class="text-muted small">${filteredStaff.length} staff records</span>`;
        return;
      }
      let html = `<span class="text-muted small">${filteredStaff.length} records</span><nav><ul class="pagination pagination-sm mb-0">`;
      for (let i = 1; i <= totalPages; i++) {
        html += `<li class="page-item ${i === currentPageNum ? 'active' : ''}"><button class="page-link" data-page="${i}">${i}</button></li>`;
      }
      html += `</ul></nav>`;
      pagination.innerHTML = html;
      pagination.querySelectorAll('.page-link').forEach(b => {
        b.addEventListener('click', () => {
          currentPageNum = parseInt(b.dataset.page);
          updatePagination();
        });
      });
    }

    // Attach events
    document.getElementById('searchStaff')?.addEventListener('input', filterStaff);
    document.getElementById('filterCategory')?.addEventListener('change', filterStaff);
    document.getElementById('filterDivision')?.addEventListener('change', filterStaff);
    document.getElementById('filterStatus')?.addEventListener('change', filterStaff);
    document.getElementById('clearFilters')?.addEventListener('click', () => {
      document.getElementById('searchStaff').value = '';
      document.getElementById('filterCategory').value = '';
      document.getElementById('filterDivision').value = '';
      document.getElementById('filterStatus').value = '';
      filterStaff();
    });
    document.getElementById('addStaffBtn')?.addEventListener('click', () => openStaffForm());
    document.getElementById('exportCsvBtn')?.addEventListener('click', () => exportStaffCsv(staff));
    document.getElementById('importCsvBtn')?.addEventListener('click', () => importStaffCsv());

    filterStaff();
  }

  function deleteStaff(id) {
    const staff = (LS.get('staff') || []).find(s => s.id === id);
    if (!staff) return;
    if (!confirm(`Delete ${staff.firstName} ${staff.surname} (${staff.staffId})? This cannot be undone.`)) return;
    let allStaff = LS.get('staff') || [];
    allStaff = allStaff.filter(s => s.id !== id);

      const endDate = document.getElementById('lEnd').value;

      modal.remove();

      <div id="reportActions" class="mt-2" style="display:none;">
        <button class="btn btn-outline-secondary btn-sm me-1" id="printReport"><i class="bi bi-printer"></i> Print</button>
        <button class="btn btn-outline-secondary btn-sm me-1" id="exportReportCsv"><i class="bi bi-download"></i> CSV</button>
        <button class="btn btn-outline-secondary btn-sm" id="exportReportPdf"><i class="bi bi-file-pdf"></i> PDF</button>
      </div>
    `;

    // Populate filter dropdowns based on report type
    document.getElementById('reportType')?.addEventListener('change', function() {
      const type = this.value;
      const filterSelect = document.getElementById('reportFilter');
      const filterValueSelect = document.getElementById('reportFilterValue');
      filterValueSelect.innerHTML = '<option value="">—</option>';

      let options = [{ value: '', label: 'All' }];
      if (type === 'Staff by Library') {
        options = libraries.map(l => ({ value: l.id, label: l.name }));
      } else if (type === 'Staff by Division') {
        options = divisions.map(d => ({ value: d.id, label: d.name }));
      } else if (type === 'Staff by Unit') {
        options = units.map(u => ({ value: u.id, label: u.name }));
      } else if (type === 'Staff by Category') {
        options = categories.map(c => ({ value: c.id, label: c.name }));
      } else if (type === 'Staff by Rank') {
        options = ranks.map(r => ({ value: r.id, label: r.name }));
      }

      filterSelect.innerHTML = options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
      filterSelect.dispatchEvent(new Event('change'));
    });

    document.getElementById('reportFilter')?.addEventListener('change', function() {
      const filterValueSelect = document.getElementById('reportFilterValue');
      filterValueSelect.innerHTML = '<option value="">—</option>';
      // Simple: just use the filter value directly
      const type = document.getElementById('reportType').value;
      const filter = this.value;
      if (filter && ['Staff by Library', 'Staff by Division', 'Staff by Unit', 'Staff by Category', 'Staff by Rank'].includes(type)) {
        filterValueSelect.innerHTML = `<option value="${filter}">${filter}</option>`;
      }
    });

    document.getElementById('generateReport')?.addEventListener('click', function() {
      const type = document.getElementById('reportType').value;
      const filter = document.getElementById('reportFilter').value;
      const output = document.getElementById('reportOutput');
      const actions = document.getElementById('reportActions');

      let reportData = [];
      let title = type;
      let columns = [];

      const getStaffName = (s) => `${s.firstName} ${s.surname}`;
      const getCat = (id) => categories.find(c => c.id === id)?.name || '-';
      const getRank = (id) => ranks.find(r => r.id === id)?.name || '-';
      const getDiv = (id) => divisions.find(d => d.id === id)?.name || '-';
      const getUnit = (id) => units.find(u => u.id === id)?.name || '-';
      const getLib = (id) => libraries.find(l => l.id === id)?.name || '-';

      switch(type) {
        case 'Staff Register':
          reportData = staff.map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Category': getCat(s.staffCategoryId),
            'Rank': getRank(s.rankId),
            'Division': getDiv(s.divisionId),
            'Unit': getUnit(s.unitId),
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Category', 'Rank', 'Division', 'Unit', 'Status'];
          break;
        case 'Staff by Library':
          reportData = staff.filter(s => !filter || s.libraryId === filter).map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Library': getLib(s.libraryId),
            'Division': getDiv(s.divisionId),
            'Unit': getUnit(s.unitId),
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Library', 'Division', 'Unit', 'Status'];
          break;
        case 'Staff by Division':
          reportData = staff.filter(s => !filter || s.divisionId === filter).map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Division': getDiv(s.divisionId),
            'Unit': getUnit(s.unitId),
            'Category': getCat(s.staffCategoryId),
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Division', 'Unit', 'Category', 'Status'];
          break;
        case 'Staff by Unit':
          reportData = staff.filter(s => !filter || s.unitId === filter).map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Unit': getUnit(s.unitId),
            'Division': getDiv(s.divisionId),
            'Category': getCat(s.staffCategoryId),
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Unit', 'Division', 'Category', 'Status'];
          break;
        case 'Staff by Category':
          reportData = staff.filter(s => !filter || s.staffCategoryId === filter).map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Category': getCat(s.staffCategoryId),
            'Rank': getRank(s.rankId),
            'Division': getDiv(s.divisionId),
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Category', 'Rank', 'Division', 'Status'];
          break;
        case 'Staff by Rank':
          reportData = staff.filter(s => !filter || s.rankId === filter).map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Rank': getRank(s.rankId),
            'Category': getCat(s.staffCategoryId),
            'Division': getDiv(s.divisionId),
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Rank', 'Category', 'Division', 'Status'];
          break;
        case 'Employment Status':
          const statuses = ['Active', 'Inactive', 'Suspended', 'Retired', 'On Leave'];
          reportData = statuses.map(st => ({
            'Status': st,
            'Count': staff.filter(s => s.employmentStatus === st).length
          }));
          columns = ['Status', 'Count'];
          break;
        case 'Staff on Leave':
          reportData = leave.map(l => {
            const s = staff.find(st => st.staffId === l.staffId);
            return {
              'Staff': s ? getStaffName(s) : l.staffName || l.staffId,
              'Leave Type': l.leaveType,
              'Start': l.startDate,
              'End': l.endDate,
              'Days': l.numberOfDays || 0,
              'Status': l.status
            };
          });
          columns = ['Staff', 'Leave Type', 'Start', 'End', 'Days', 'Status'];
          break;
        case 'Training Report':
          reportData = training.map(t => {
            const s = staff.find(st => st.staffId === t.staffId);
            return {
              'Staff': s ? getStaffName(s) : t.staffName || t.staffId,
              'Programme': t.programmeName,
              'Organizer': t.organizer,
              'Start': t.startDate,
              'End': t.endDate,
              'Status': t.status
            };
          });
          columns = ['Staff', 'Programme', 'Organizer', 'Start', 'End', 'Status'];
          break;
        case 'Retirement/Promotion Overview':
          reportData = staff.filter(s => s.retirementDate || s.lastPromotionDate).map(s => ({
            'Staff ID': s.staffId,
            'Name': getStaffName(s),
            'Retirement Date': s.retirementDate || '-',
            'Last Promotion': s.lastPromotionDate || '-',
            'Next Promotion Due': s.nextPromotionDue || '-',
            'Status': s.employmentStatus
          }));
          columns = ['Staff ID', 'Name', 'Retirement Date', 'Last Promotion', 'Next Promotion Due', 'Status'];
          break;
        default:
          reportData = staff.map(s => ({ 'Staff ID': s.staffId, 'Name': getStaffName(s), 'Status': s.employmentStatus }));
          columns = ['Staff ID', 'Name', 'Status'];
      }

      // Render report
      if (!reportData.length) {
        output.innerHTML = '<div class="empty-state"><i class="bi bi-file-earmark"></i>No data for this report</div>';
        actions.style.display = 'none';
        return;
      }

      let html = `<div class="table-responsive"><table class="table table-sm table-striped" id="reportTable"><thead><tr>${columns.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>`;
      reportData.forEach(row => {
        html += '<tr>' + columns.map(c => `<td>${escapeHtml(String(row[c] || '-'))}</td>`).join('') + '</tr>';
      });
      html += `</tbody></table></div><p class="text-muted small">${reportData.length} records · Generated: ${new Date().toLocaleString()}</p>`;
      output.innerHTML = html;
      actions.style.display = 'block';
      window._reportData = reportData;
      window._reportColumns = columns;

      // Print report
      document.getElementById('printReport')?.addEventListener('click', () => window.print());
      // CSV export
      document.getElementById('exportReportCsv')?.addEventListener('click', () => {
        const data = window._reportData || [];
        const cols = window._reportColumns || [];
        if (!data.length) return;
        const csv = [cols.join(','), ...data.map(row => cols.map(c => `"${(row[c] || '').replace(/"/g, '""')}"`).join(','))].join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'report.csv'; a.click();
        URL.revokeObjectURL(url);
        showToast('CSV exported', 'success');
      });
      // PDF export
      document.getElementById('exportReportPdf')?.addEventListener('click', () => {
        const content = document.getElementById('reportOutput').cloneNode(true);
        const wrapper = document.createElement('div');
        wrapper.style.padding = '20px';
        wrapper.style.fontFamily = 'sans-serif';
        wrapper.innerHTML = `<h2>ABU Library PMIS</h2><h4>${title}</h4><p>Generated: ${new Date().toLocaleString()}</p>`;
        wrapper.appendChild(content);
        document.body.appendChild(wrapper);
        html2pdf().from(wrapper).save('report.pdf').then(() => wrapper.remove());
        showToast('PDF generated', 'success');
      });
    });

    // Trigger initial change
    document.getElementById('reportType')?.dispatchEvent(new Event('change'));
  }

  function exportStaffCsv(staff) {
    if (!staff || !staff.length) { showToast('No staff to export', 'warning'); return; }
    const headers = ['StaffID','Title','FirstName','Surname','Gender','Email','Phone','Category','Rank','Division','Unit','Status','AppointmentDate'];
    const rows = staff.map(s => {
      const cat = LS.get('staffCategories')?.find(c => c.id === s.staffCategoryId);
      const rank = LS.get('ranks')?.find(r => r.id === s.rankId);
      const div = LS.get('divisions')?.find(d => d.id === s.divisionId);
      const unit = LS.get('units')?.find(u => u.id === s.unitId);
      return [s.staffId, s.title || '', s.firstName, s.surname, s.gender, s.email, s.phone || '', cat?.name || '', rank?.name || '', div?.name || '', unit?.name || '', s.employmentStatus, s.dateFirstAppointment];
    });
    const csv = [headers.join(','), ...rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))].join('\n');
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'staff_records.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('CSV exported', 'success');
  }

  function importStaffCsv() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.csv';
    input.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const text = ev.target.result;
          const lines = text.split('\n').filter(l => l.trim());
          if (lines.length < 2) { showToast('Invalid CSV', 'danger'); return; }
          const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
          const staffList = LS.get('staff') || [];
          let count = 0;
          for (let i = 1; i < lines.length; i++) {
            const vals = lines[i].split(',').map(v => v.replace(/^"|"$/g, '').trim());
            if (vals.length < 4) continue;
            const cat = LS.get('staffCategories')?.find(c => c.name === vals[7]);
            const rank = LS.get('ranks')?.find(r => r.name === vals[8]);
            const div = LS.get('divisions')?.find(d => d.name === vals[9]);
            const unit = LS.get('units')?.find(u => u.name === vals[10]);
            const staffId = vals[0] || generateStaffId();
            if (staffList.find(s => s.staffId === staffId)) continue;
            staffList.push({
              id: 's_' + Date.now() + '_' + i,
              staffId: staffId,
              title: vals[1] || '',
              firstName: vals[2] || 'Unknown',
              middleName: '',
              surname: vals[3] || '',
              gender: vals[4] || 'Male',
              dateOfBirth: '',
              phone: vals[6] || '',
              email: vals[5] || '',
              address: '',
              photo: '',
              staffCategoryId: cat?.id || '',
              rankId: rank?.id || '',
              employmentType: 'Permanent',
              dateFirstAppointment: vals[12] || new Date().toISOString().split('T')[0],
              dateCurrentAppointment: '',
              confirmationStatus: 'Confirmed',
              employmentStatus: vals[11] || 'Active',
              retirementDate: '',
              lastPromotionDate: '',
              nextPromotionDue: '',
              role: '',
              remarks: '',
              libraryId: 'lib_1',
              divisionId: div?.id || '',
              unitId: unit?.id || null,
              highestQualification: '',
              fieldOfStudy: '',
              specialization: '',
              professionalMembership: '',
              createdAt: new Date().toISOString()
            });
            count++;
          }
          LS.set('staff', staffList);
          showToast(`Imported ${count} staff records`, 'success');
          renderPage('staff-records');
        } catch (err) {
          showToast('Error importing CSV: ' + err.message, 'danger');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  }

  // =================================================================

      <table style="width:100%;border-collapse:collapse;font-size:13px;">

        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Gender</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${staff.gender || '-'}</td></tr>

        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Phone</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${staff.phone || '-'}</td></tr>
        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Staff Category</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${cat?.name || '-'}</td></tr>
        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Rank/Designation</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${rank?.name || '-'}</td></tr>

        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Date First Appointment</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${staff.dateFirstAppointment || '-'}</td></tr>

        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Library</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${LS.get('libraries')?.find(l => l.id === staff.libraryId)?.name || '-'}</td></tr>
        <tr><td style="padding:4px;border-bottom:1px solid #eee;"><strong>Division</strong></td><td style="padding:4px;border-bottom:1px solid #eee;">${div?.name || '-'}</td></tr>

  // =================================================================
  //  22. INITIALIZATION
  // =================================================================
  function init() {
    // Set footer year
    document.getElementById('yearFooter').textContent = new Date().getFullYear();
    document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
      weekday: 'short',
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });

    // Initialize data
    initData();

    // Apply theme from settings
    const settings = LS.get('settings');
    if (settings && settings.theme) {
      applyTheme(settings.theme);
    }

    // Setup logout
    document.getElementById('logoutBtn')?.addEventListener('click', logout);

    // Theme toggle button (navbar)
    document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);

    // Check authentication
    if (checkAuth()) {
      renderPage('dashboard');
    }

    // Storage change listener (multi-tab)
    window.addEventListener('storage', function(e) {
      if (['staff', 'libraries', 'divisions', 'units', 'leaveRecords', 'trainingRecords'].includes(e.key)) {
        if (['dashboard', 'staff-records', 'library-structure', 'leave-management', 'training-management', 'reports'].includes(currentPage)) {
          renderPage(currentPage);
        }
      }
    });
  }

  // =================================================================
  //  23. START APPLICATION
  // =================================================================
  document.addEventListener('DOMContentLoaded', init);

})();
</script>
